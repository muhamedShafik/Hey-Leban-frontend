<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- ── Favicon ── -->
    <link rel="icon" type="image/png" href="/favicon.png" />

    <!-- ── Viewport ── -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ── PWA / Web App Manifest ── -->
    <link rel="manifest" href="/manifest.json" />

    <!-- ── Theme Color (status bar tint) ── -->
    <meta name="theme-color" content="#0f172a" />

    <!-- ═══════════════════════════════════════════════
         iOS / Safari PWA — these are REQUIRED for iOS
    ═══════════════════════════════════════════════ -->

    <!-- Tell Safari this is a standalone web app -->
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <!-- Status bar style: default | black | black-translucent -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- App name that appears under the icon on the home screen -->
    <meta name="apple-mobile-web-app-title" content="Hey Leban" />

    <!-- Home-screen icon (iOS ignores the manifest icons) -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- ── Splash screens for every common iPhone / iPad size ──
         iOS Safari shows these while loading the PWA.
         Generate them at: https://progressier.com/pwa-screenshots  -->
    <!-- iPhone SE (2nd gen) -->
    <link rel="apple-touch-startup-image"
          media="screen and (device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
          href="/splash-750x1334.png" />
    <!-- iPhone 8 Plus / 7 Plus / 6s Plus -->
    <link rel="apple-touch-startup-image"
          media="screen and (device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
          href="/splash-1242x2208.png" />
    <!-- iPhone X / XS / 11 Pro -->
    <link rel="apple-touch-startup-image"
          media="screen and (device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
          href="/splash-1125x2436.png" />
    <!-- iPhone XR / 11 -->
    <link rel="apple-touch-startup-image"
          media="screen and (device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
          href="/splash-828x1792.png" />
    <!-- iPhone 12 / 13 / 14 -->
    <link rel="apple-touch-startup-image"
          media="screen and (device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
          href="/splash-1170x2532.png" />
    <!-- iPhone 14 Pro / 15 -->
    <link rel="apple-touch-startup-image"
          media="screen and (device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
          href="/splash-1179x2556.png" />
    <!-- iPhone 14 Plus / 15 Plus / 15 Pro Max -->
    <link rel="apple-touch-startup-image"
          media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)"
          href="/splash-1290x2796.png" />
    <!-- iPad Mini 6 -->
    <link rel="apple-touch-startup-image"
          media="screen and (device-width: 744px) and (device-height: 1133px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
          href="/splash-1488x2266.png" />
    <!-- iPad Air 4 / 5 / iPad Pro 11" -->
    <link rel="apple-touch-startup-image"
          media="screen and (device-width: 820px) and (device-height: 1180px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
          href="/splash-1640x2360.png" />
    <!-- iPad Pro 12.9" -->
    <link rel="apple-touch-startup-image"
          media="screen and (device-width: 1024px) and (device-height: 1366px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)"
          href="/splash-2048x2732.png" />

    <!-- ── Fonts ── -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
    />
    <title>Hey Leban</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
